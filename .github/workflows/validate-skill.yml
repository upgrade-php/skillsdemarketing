name: Validate Agent Skill

on:
  push:
    branches: [main]
    paths:
      - "**/SKILL.md"
      - ".github/workflows/validate-skill.yml"
  pull_request:
    branches: [main]
    # Sem filtro de paths: a ruleset exige o check "Skill frontmatter
    # validation". Se o workflow for pulado, o GitHub fica em
    # "Expected — Waiting for status to be reported" e o PR não fecha.

concurrency:
  group: validate-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true && github.actor != 'dependabot[bot]'
    outputs:
      skills: ${{ steps.changed-skills.outputs.skills }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed skills
        id: changed-skills
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
            HEAD=${{ github.event.pull_request.head.sha }}
          else
            BASE=${{ github.event.before }}
            HEAD=${{ github.event.after }}
          fi

          SKILL_FILES=$(git diff --name-only "$BASE" "$HEAD" | grep 'SKILL.md$' || true)

          if [ -z "$SKILL_FILES" ]; then
            SKILLS='[]'
          else
            SKILLS=$(printf '%s\n' "$SKILL_FILES" | \
              xargs -I {} dirname {} | \
              sort -u | \
              jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          echo "skills=$SKILLS" >> $GITHUB_OUTPUT
          echo "Changed skills: $SKILLS"

  validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.detect-changes.outputs.skills) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate ${{ matrix.skill }}
        uses: Flash-Brew-Digital/validate-skill@v1
        with:
          path: ${{ matrix.skill }}

  # Fixed-name aggregator: the `validate` job above runs as a dynamic matrix (one
  # differently-named check per changed skill), which can't be referenced directly
  # as a required status check. This job always runs with a stable name and fails
  # if any matrix entry failed, so it is what the branch ruleset requires (FR-012).
  gate:
    name: Skill frontmatter validation
    needs: [detect-changes, validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check validation result
        run: |
          result="${{ needs.validate.result }}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "Skill frontmatter validation failed (result: $result)"
            exit 1
          fi
          # success = skills validadas; skipped = nenhum SKILL.md neste PR
          echo "OK (result: $result)"
