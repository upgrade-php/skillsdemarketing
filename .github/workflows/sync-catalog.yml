name: Sync Catalog

# Regenera catalog.json automaticamente sempre que o frontmatter de uma
# skill ou o mapeamento de categorias mudar, e commita o resultado — mesmo
# padrão do workflow sync-skills.yml do upstream (FR-015, T079).
on:
  push:
    branches: [main]
    paths:
      - "skills/**/SKILL.md"
      - "scripts/categories.json"
      - "scripts/generate-catalog.mjs"

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gerar catalog.json
        run: node scripts/generate-catalog.mjs

      - name: Commitar mudanças
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_user_name: skillsdemarketing-bot
          commit_user_email: actions@github.com
          commit_message: "chore: regenerar catalog.json"
          file_pattern: "catalog.json"
