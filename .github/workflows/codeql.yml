name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catch newly disclosed vulnerabilities in code that didn't change.
    - cron: "24 7 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The fork's own content is Markdown/YAML today, but it is expected
        # to inherit the original marketingskills repo's `tools/*` and
        # `scripts/*.mjs` (JavaScript) as skills get adapted — see
        # prd-marketingskills-ptbr.md §3 and §6 (R2/R6).
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
