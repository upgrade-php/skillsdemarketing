# Running `pre-commit install` alone (the documented setup step) installs
# both hook types below, so contributors get commit-msg linting for free.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
        # SKILL.md frontmatter is YAML embedded in Markdown, not a standalone
        # .yml/.yaml file, so it is out of scope for this hook by design.
      - id: detect-private-key

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yaml]

  # Enforces Conventional Commits (https://www.conventionalcommits.org) on the
  # commit message itself — runs at the commit-msg stage, not pre-commit.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - build
          - chore
          - ci
          - docs
          - style
          - refactor
          - perf
          - test
          - revert
